name: Validation Nacre
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nacre-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Contrôler les fichiers suivis
        run: python scripts/check_repository.py
      - name: Installer restic avec vérification SHA-256
        run: python console/install_restic.py
      - name: Tester la console et la protection
        env:
          NAS_RESTIC_BIN: ${{ github.workspace }}/.tools/restic
        run: python -m unittest discover -s tests -v
      - name: Vérifier le JavaScript
        run: |
          node --check console/static/app.js
          node --check console/static/native.js
          node --check console/static/alerts.js
          node --check console/static/notifications.js
          node --check console/static/retention.js
          node --test tests/test_frontend.js
  frigate:
    name: Frigate WebSocket / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Construire depuis la base épinglée et vérifier la course WebSocket
        shell: bash
        run: |
          set -euo pipefail
          frigate_base=$(python3 -c 'from platform_config import profile; print(profile()["NACRE_FRIGATE_IMAGE"])')
          docker build --build-arg "FRIGATE_IMAGE=$frigate_base" -t nacre-frigate-check ./frigate
          docker run --rm --network none --read-only --memory 1g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --mount "type=bind,src=$PWD/frigate,dst=/checks,readonly" \
            --entrypoint python3 nacre-frigate-check -B /checks/check_websocket.py
  secrets:
    name: Secrets / Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Télécharger et vérifier Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scanner l’historique sans afficher les secrets
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner'
