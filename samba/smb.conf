[global]
    server role = standalone server
    server string = NAS autonome - laboratoire
    workgroup = WORKGROUP
    security = user
    map to guest = never
    server min protocol = SMB2
    smb ports = 445
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    log file = /dev/stdout
    max log size = 0

[fichiers]
    path = /shares/fichiers
    valid users = nas
    read only = no
    create mask = 0660
    directory mask = 0770

[video]
    path = /shares/video
    valid users = nas
    read only = yes
